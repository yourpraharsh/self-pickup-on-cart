name: patch-2
on:
  push:
    paths: [".github/workflows/patch-2.yml"]
  workflow_dispatch:
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  run:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Patch
        run: |
          cp 'index.html' /tmp/old.html
          mkdir -p /tmp/upload && cp -r .github/upload/. /tmp/upload/
          export PATCH="$(cat $(ls .github/upload/p*.txt | sort) | tr -d '\n\r ' | base64 -d | gunzip)"
          rm -rf .github/upload
          cat > /tmp/apply.py <<'PY'
          import base64, gzip, hashlib, json, os, sys
          path, old_sha, new_sha = sys.argv[1], sys.argv[2], sys.argv[3]
          old = open(path, encoding="utf-8").read()
          assert hashlib.sha256(old.encode()).hexdigest() == old_sha, "old file is not the expected version"
          changes = json.loads(gzip.decompress(base64.b64decode(os.environ["PATCH"])))
          spans = []
          for pre, suf, new in changes:
              if pre:
                  assert old.count(pre) == 1, "prefix anchor not unique: " + pre[:60]
                  p = old.index(pre) + len(pre)
              else:
                  p = 0
              s = old.index(suf, p) if suf else len(old)
              spans.append((p, s, new))
          spans.sort()
          out, last = [], 0
          for p, s, new in spans:
              assert p >= last, "overlapping changes"
              out += [old[last:p], new]; last = s
          out.append(old[last:])
          res = "".join(out)
          assert hashlib.sha256(res.encode()).hexdigest() == new_sha, "result does not match the expected file"
          open(path, "w", encoding="utf-8").write(res)
          print("patched", path, len(changes), "changes")
          PY
          python3 /tmp/apply.py 'index.html' fd91f2a68a7085cbae6611237ac7800205dbf11347fe578239d13681d4bf726d 2c0fe0deec049f4a81e45f94816bee5727a7749509a24379efd1652aede29c64
      - name: Extra
        run: |
          pip install -q pillow
          python3 /tmp/upload/regen.py ebb00d7454eb2c7c98d1a8b6117d43dc8429b3fe7afa042d692df7e8ad4bf7ac
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "patch-2: update index.html" && git push || echo "nothing to commit"
      - name: Site
        run: |
          mkdir _site
          tar --exclude=./.git --exclude=./.github --exclude=./_site -cf - . | tar -xf - -C _site
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
