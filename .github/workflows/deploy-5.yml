name: deploy-5
on:
  push:
    paths: [".github/workflows/deploy-5.yml"]
  workflow_dispatch:
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  run:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Patch
        env:
          P1: 
          P2: 
        run: |
          cat > /tmp/a.py <<'PY'
          import base64,gzip,hashlib,json,os,re,sys
          O=lambda f,m='r':open(f,m,encoding='utf-8')
          H=lambda s:hashlib.sha256(s.encode()).hexdigest()
          def ap(path,env,o,n):
           s=O(path).read();assert H(s)==o
           sp=[]
           for p,u,t in json.loads(gzip.decompress(base64.b64decode(os.environ[env]))):
            a=s.index(p)+len(p) if p else 0;assert not p or s.count(p)==1;sp.append((a,s.index(u,a) if u else len(s),t))
           r,l=[],0
           for a,b,t in sorted(sp):r+=[s[l:a],t];l=b
           r=''.join(r+[s[l:]]);assert H(r)==n;return r
          P=re.compile(r'data:[a-z]+/[a-z0-9.+-]+;base64,[A-Za-z0-9+/=]+')
          x=ap('index.html','P1',sys.argv[1],sys.argv[2]);O('index.html','w').write(x)
          M={hashlib.sha1(m.encode()).hexdigest():m for m in P.findall(x)}
          y=re.sub(r'@@R:([0-9a-f]{40})@@',lambda m:M[m.group(1)],ap('review/index.html','P2',sys.argv[3],sys.argv[4]))
          assert H(P.sub('@@M@@',y))==sys.argv[5];O('review/index.html','w').write(y)
          PY
          python3 /tmp/a.py b814c99e54e7e415e7a4e2c04201aed461b4200dba8cfab5293a524e2004c6c6 136fa80d1b555bf3509d9db640ea80e919ca0c56a19d19bdb883307878a06473 b5882604dadeb336bb876ea672de12cdf1814a4a28fd931165292059bc4c4b99 c66bc62dfcd9fe12663c6d3128a3b426a925b0c8dc4e684b10d9f0817dfa6e1f 4a1dad1b8e472bafbe873802bed542022e86c4402864b4003f63dfabe8876055
      - name: Commit
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "deploy-5" && git push
      - name: Site
        run: |
          mkdir _site
          tar --exclude=./.git --exclude=./.github --exclude=./_site -cf - . | tar -xf - -C _site
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
